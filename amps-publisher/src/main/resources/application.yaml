spring:
  application:
    name: amps-publisher

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO

amps:
  client-name: publisher-client
  host: localhost
  port: 9007
  topic: orders
  queue: orders-queue

publisher:
  queue-capacity: 10000
  batch-size: 100